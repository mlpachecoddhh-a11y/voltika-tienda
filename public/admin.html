<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administración · Voltika</title>
<meta name="theme-color" content="#161b1d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 112'><polygon points='4,10 40,10 74,84 60,104' fill='%23161b1d'/><polygon points='70,10 116,10 90,48 104,48 60,108 72,62 56,62' fill='%232f9c34'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&family=Anton&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cc92e"/><stop offset=".55" stop-color="#2f9c34"/><stop offset="1" stop-color="#0e7a34"/></linearGradient>
    <symbol id="logo-v" viewBox="0 0 120 112">
      <polygon points="4,10 40,10 74,84 60,104" fill="#161b1d"/>
      <polygon points="70,10 116,10 90,48 104,48 60,108 72,62 56,62" fill="url(#g-bolt)"/>
      <polygon points="70,10 88,10 66,52 58,52" fill="#7fd63a" opacity=".55"/>
    </symbol>
  </defs>
</svg>

<div class="login" id="loginView">
  <div class="login-card">
    <div class="top">
      <svg viewBox="0 0 120 112" aria-hidden="true" style="background:#e9ecee;border-radius:6px;padding:4px"><use href="#logo-v"/></svg>
      <div><b>VOLTIKA</b><small>Administración</small></div>
    </div>
    <form id="loginForm" novalidate>
      <label for="lUser">Usuario<input id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label for="lPass">Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lErr" hidden></div>
      <button class="btn lime" type="submit" id="lBtn" style="justify-content:center">Ingresar</button>
      <a href="/" style="font-size:.85rem;color:var(--muted);text-align:center">Volver a la tienda</a>
    </form>
  </div>
</div>

<div class="admin page" id="adminView" hidden>
  <div class="a-bar">
    <div class="wrap">
      <h2>Administración <span>Voltika</span></h2>
      <span class="who" id="who"></span>
      <span class="status" id="aStatus">Sin cambios</span>
      <button class="btn ghost small" type="button" id="aDiscard" disabled>Descartar</button>
      <button class="btn lime small" type="button" id="aSave" disabled>Guardar y publicar</button>
      <a class="btn ghost small" href="/" target="_blank" rel="noopener">Ver tienda</a>
      <button class="btn ghost small" type="button" id="aLogout">Salir</button>
    </div>
  </div>
  <div class="wrap a-main" id="aMain"><p class="loading">Cargando catálogo…</p></div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/comun.js"></script>
<script src="/admin.js"></script>
</body>
</html>
